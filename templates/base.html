<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Second-Order SQLi Lab{% endblock %}</title>
    <style>
        body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #0f1115; color: #e6e6e6; }
        a { color: #7dc4ff; }
        nav { margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #2a2d34; }
        nav a { margin-right: 16px; }
        input { width: 100%; padding: 8px; margin: 6px 0 14px; background: #1a1d24; border: 1px solid #2a2d34; color: #e6e6e6; border-radius: 4px; box-sizing: border-box; }
        button { padding: 8px 16px; background: #3f6fd1; border: none; color: white; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #2a2d34; }
        .error { background: #4a1f1f; border: 1px solid #7a2e2e; padding: 10px; border-radius: 4px; color: #ffb3b3; }
        .warn { background: #3a3320; border: 1px solid #7a6a2e; padding: 10px; border-radius: 4px; color: #ffe4a3; margin-bottom: 16px; font-size: 14px;}
        code { background: #1a1d24; padding: 2px 6px; border-radius: 3px; }
        pre { background: #1a1d24; padding: 12px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="warn">⚠ Educational lab — intentionally vulnerable. Do not deploy publicly with real data.</div>
    <nav>
        <a href="{{ url_for('index') }}">Home</a>
        {% if session.get('username') %}
            <a href="{{ url_for('expenses') }}">Expenses</a>
            <a href="{{ url_for('generate_report') }}">Generate Report</a>
            <a href="{{ url_for('logout') }}">Logout ({{ session['username'] }})</a>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('signup') }}">Sign up</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
