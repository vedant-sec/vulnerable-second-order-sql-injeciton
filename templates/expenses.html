{% extends "base.html" %}
{% block content %}
<h2>Expenses for {{ username }}</h2>
<form method="POST">
    <label>Description</label>
    <input name="description" required>
    <label>Amount</label>
    <input name="amount" type="number" step="0.01" required>
    <label>Date</label>
    <input name="date" type="date" required>
    <button type="submit">Add expense</button>
</form>
<table>
    <tr><th>Description</th><th>Amount</th><th>Date</th></tr>
    {% for e in expenses %}
    <tr><td>{{ e['description'] }}</td><td>{{ e['amount'] }}</td><td>{{ e['date'] }}</td></tr>
    {% endfor %}
</table>
<p><a href="{{ url_for('generate_report') }}"><button>Generate Report</button></a></p>
{% endblock %}
