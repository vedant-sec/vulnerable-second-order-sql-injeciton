{% extends "base.html" %}
{% block content %}
<h2>Sign up</h2>
<p>Try a normal username first. Later, try signing up again with a payload username to test second-order injection.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
    <label>Username</label>
    <input name="username" required>
    <label>Password</label>
    <input name="password" type="password" required>
    <button type="submit">Sign up</button>
</form>
{% endblock %}
